[package]
name = "five-psalms"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", features = ["json"] }
jiff = { version = "0.2.37", features = ["js"] }
leptos = { version = "0.8.21", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Navigator", "ServiceWorkerContainer", "ServiceWorkerRegistration"] }
